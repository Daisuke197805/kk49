<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>岸和田高校同窓会 個別会費振込案内</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    h1 {
      font-size: 1.4rem;
      color: #1a365d;
      text-align: center;
      margin-top: 0;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid #e2e8f0;
    }
    .step-list {
      list-style: none;
      padding: 0;
      margin: 0 0 24px 0;
    }
    .step-list li {
      margin-bottom: 14px;
      font-size: 1rem;
    }
    .bank-box {
      background-color: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 16px 20px;
      margin-bottom: 28px;
    }
    .bank-box h2 {
      font-size: 1rem;
      margin-top: 0;
      margin-bottom: 12px;
      color: #334155;
    }
    .bank-box p {
      margin: 6px 0;
      font-size: 0.95rem;
    }
    .btn-wrapper {
      text-align: center;
      margin-top: 20px;
    }
    .mail-btn {
      display: inline-block;
      background-color: #2563eb;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      padding: 14px 28px;
      border-radius: 6px;
      transition: background-color 0.2s;
    }
    .mail-btn:hover {
      background-color: #1d4ed8;
    }
    .mail-note {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>岸和田高校同窓会の個別会費振込案内</h1>

    <ul class="step-list">
      <li>①幹事から連絡のあった方は、その際に指定された金額を以下の口座にお振込をお願いします。</li>
      <li>②振込完了後は、幹事のメールまで完了の旨をご連絡ください。</li>
    </ul>

    <!-- お振込先口座情報 -->
    <div class="bank-box">
      <h2>【お振込先口座】</h2>
      <p>金融機関名：三井住友銀行</p>
      <p>支店名：オリーブHENNA支店（692）</p>
      <p>口座種別：普通</p>
      <p>口座番号：0739189</p>
      <p>口座名義：サイトウ ダイスケ</p>
    </div>

    <div class="btn-wrapper">
      <a href="mailto:kishikou49@google.com?subject=【岸和田高校同窓会】会費振込完了の連絡&body=幹事様%0D%0A%0D%0Aお疲れ様です。%0D%0A氏名：%0D%0A%0D%0A指定口座への会費の振込が完了いたしましたのでご報告いたします。" class="mail-btn">
        幹事へ振込完了メールを送る
      </a>
      <p class="mail-note">
        ※ボタンが動作しない場合は、<strong>kishikou49@google.com</strong> まで直接ご連絡ください。
      </p>
    </div>
  </div>

</body>
</html>
